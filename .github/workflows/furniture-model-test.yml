name: Furniture model render test
on:
  push:
    paths:
      - '.github/workflows/furniture-model-test.yml'
      - 'tests/furniture_model_test.py'
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install Blender
        run: sudo apt-get update && sudo apt-get install -y blender
      - name: Build and render furniture
        run: |
          mkdir -p /tmp/output
          blender -b --python tests/furniture_model_test.py
          cp /tmp/output/* output/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: furniture-test-output
          path: /tmp/output/
