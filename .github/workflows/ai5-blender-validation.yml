name: AI-5 Blender Cycles validation

on:
  push:
    branches:
      - ai-5-modern-residence-modeling
    paths:
      - 'scripts/ai5_modern_residence.py'
      - '.github/workflows/ai5-blender-validation.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender
          blender --version
      - name: Validate script syntax
        run: python3 -m py_compile scripts/ai5_modern_residence.py
      - name: Generate blend and render three cameras
        run: |
          mkdir -p outputs/ai5
          blender -b -t 4 --python scripts/ai5_modern_residence.py 2>&1 | tee outputs/ai5/blender.log
      - name: Verify expected outputs
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('outputs/ai5')
          names = ['modern_residence_blockout.blend', 'CAM_01_Wide.png', 'CAM_02_Lounge.png', 'CAM_03_Dining.png']
          for name in names:
              file = p / name
              assert file.exists() and file.stat().st_size > 1000, f'Missing/empty: {file}'
              print(f'OK: {file}: {file.stat().st_size} bytes')
          PY
      - name: Upload render evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai5-modern-residence-render
          path: outputs/ai5/
          if-no-files-found: warn
          retention-days: 14
